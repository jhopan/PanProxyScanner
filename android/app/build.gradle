plugins {
    id 'com.android.application'
}

android {
    namespace 'id.panproxyscanner'
    compileSdk 34

    defaultConfig {
        applicationId "id.panproxyscanner"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // APK yang dirilis memakai varian debug supaya sudah tertandatangan dan bisa
            // langsung dipasang (sideload) tanpa keystore.
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
